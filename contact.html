<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Bastonul</title>
    <link rel="icon" type="image/x-icon" href="logoflavicon.svg">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            flex-direction: column;
            margin: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.08) 180px,
                transparent 420px
            ), #e7e7e7;
            font-family: Arial, sans-serif;
        }

        .navigation {
            position: fixed;
            top: 20px;
            left: 50%;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(-50%);
        }

        .logo-pill,
        .topbar {
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-pill {
            display: grid;
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            place-items: center;
        }

        .logo-pill img {
            display: block;
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
        }

        .topbar a {
            padding: 10px 16px;
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 160ms ease;
        }

        .topbar a:hover,
        .topbar a:focus-visible {
            background: rgba(255, 255, 255, 0.2);
        }

        .topbar a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        main {
            display: grid;
            width: min(900px, calc(100% - 48px));
            flex: 1;
            align-content: center;
            margin: 0 auto;
            padding: 112px 0 48px;
            color: #141414;
        }

        .contact-content {
            font-family: Arial, sans-serif;
            font-size: clamp(17px, 2vw, 20px);
            line-height: 1.65;
        }

        .contact-content h1 {
            margin: 0 0 24px;
            font-size: clamp(36px, 5vw, 60px);
            line-height: 1.1;
        }

        .contact-list {
            display: grid;
            gap: 18px;
        }

        .contact-item {
            display: grid;
            gap: 4px;
        }

        .contact-item a {
            width: fit-content;
            color: inherit;
            text-decoration: none;
        }

        .contact-item a:hover,
        .contact-item a:focus-visible {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .site-footer {
            padding: 16px 24px;
            background: #e7e7e7;
            color: #999999;
            font-size: 13px;
            text-align: center;
        }

        .site-footer-content {
            display: flex;
            width: fit-content;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0 auto;
            padding: 12px 64px 0;
            border-top: 2px solid currentColor;
            gap: 8px 16px;
        }

        .site-footer a {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .navigation {
                top: 12px;
                right: 12px;
                left: 12px;
                width: auto;
                gap: 6px;
                transform: none;
            }

            .logo-pill {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
            }

            .logo-pill img {
                width: 28px;
                height: 28px;
            }

            .topbar {
                min-width: 0;
                flex: 1;
                justify-content: space-between;
                gap: 2px;
                padding: 6px;
            }

            .topbar a {
                padding: 8px clamp(4px, 1.8vw, 7px);
                font-size: clamp(9px, 2.8vw, 11px);
            }

            main {
                width: min(100% - 40px, 560px);
                padding-top: 112px;
            }

            .site-footer-content {
                padding-right: 24px;
                padding-left: 24px;
            }
        }

        @media (max-width: 360px) {
            .navigation {
                right: 8px;
                left: 8px;
                gap: 4px;
            }

            .logo-pill {
                width: 36px;
                height: 36px;
                flex-basis: 36px;
            }

            .logo-pill img {
                width: 24px;
                height: 24px;
            }

            .topbar {
                gap: 0;
                padding: 5px;
            }

            .topbar a {
                padding: 6px 3px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header class="navigation">
        <a class="logo-pill" href="index.html" aria-label="Bastonul home">
            <img src="logo.png" alt="Bastonul logo">
        </a>
        <nav class="topbar" aria-label="Main navigation">
            <a href="bastobrowser.html">BastoBrowser</a>
            <a href="bastoos.html">BastoOS</a>
            <a href="about.html">About</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>
    <main>
        <section class="contact-content" aria-labelledby="contact-title">
            <h1 id="contact-title">Contact</h1>
            <div class="contact-list">
                <div class="contact-item">
                    <span>Email of the CEO</span>
                    <a href="mailto:dickergol@gmail.com">dickergol@gmail.com</a>
                </div>
                <div class="contact-item">
                    <span>Email of the designer</span>
                    <a href="mailto:dickergol@gmail.com">dickergol@gmail.com</a>
                </div>
                <div class="contact-item">
                    <span>Email for support</span>
                    <a href="mailto:dickergol@gmail.com">dickergol@gmail.com</a>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-content">
            <span>Copyright © 2026 Bastonul All rights reserved.</span>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-use.html">Terms of Use</a>
        </div>
    </footer>
</body>
</html>
