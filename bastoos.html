<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BastoOS - Bastonul</title>
    <link rel="icon" type="image/x-icon" href="logoflavicon.svg">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            flex-direction: column;
            margin: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.08) 180px,
                transparent 420px
            ), #e7e7e7;
            font-family: Arial, sans-serif;
        }

        .navigation {
            position: fixed;
            top: 20px;
            left: 50%;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(-50%);
        }

        .logo-pill,
        .topbar {
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-pill {
            display: grid;
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            place-items: center;
        }

        .logo-pill img {
            display: block;
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
        }

        .topbar a {
            padding: 10px 16px;
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 160ms ease;
        }

        .topbar a:hover,
        .topbar a:focus-visible {
            background: rgba(255, 255, 255, 0.2);
        }

        .topbar a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        main {
            flex: 1;
        }

        .browser-intro {
            display: grid;
            width: min(1120px, calc(100% - 48px));
            min-height: 100vh;
            min-height: 100svh;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 48px;
            margin: 0 auto;
            padding: 104px 0 48px;
        }

        .browser-intro-copy {
            color: #141414;
            font-family: Arial, sans-serif;
        }

        .browser-intro-copy h1 {
            margin: 0 0 20px;
            font-size: clamp(36px, 5vw, 60px);
            line-height: 1.1;
        }

        .browser-intro-copy p {
            max-width: 520px;
            margin: 0 0 28px;
            font-size: clamp(18px, 2vw, 22px);
            line-height: 1.5;
        }

        .browser-intro-image {
            display: block;
            width: 100%;
            max-height: 520px;
            object-fit: contain;
        }

        .download-button {
            display: inline-block;
            min-width: 220px;
            padding: 17px 42px;
            border: 0;
            border-radius: 999px;
            background: #07163f;
            color: #fff;
            font: inherit;
            font-size: 19px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }

        .download-button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .site-footer {
            padding: 16px 24px;
            background: #e7e7e7;
            color: #999999;
            font-size: 13px;
            text-align: center;
        }

        .site-footer-content {
            display: flex;
            width: fit-content;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0 auto;
            padding: 12px 64px 0;
            border-top: 2px solid currentColor;
            gap: 8px 16px;
        }

        .site-footer a {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .navigation {
                top: 12px;
                right: 12px;
                left: 12px;
                width: auto;
                gap: 6px;
                transform: none;
            }

            .logo-pill {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
            }

            .logo-pill img {
                width: 28px;
                height: 28px;
            }

            .topbar {
                min-width: 0;
                flex: 1;
                justify-content: space-between;
                gap: 2px;
                padding: 6px;
            }

            .topbar a {
                padding: 8px clamp(4px, 1.8vw, 7px);
                font-size: clamp(9px, 2.8vw, 11px);
            }

            .browser-intro {
                width: min(100% - 40px, 560px);
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 112px 0 48px;
            }

            .browser-intro-image {
                max-height: 320px;
            }

            .site-footer-content {
                padding-right: 24px;
                padding-left: 24px;
            }
        }

        @media (max-width: 360px) {
            .navigation {
                right: 8px;
                left: 8px;
                gap: 4px;
            }

            .logo-pill {
                width: 36px;
                height: 36px;
                flex-basis: 36px;
            }

            .logo-pill img {
                width: 24px;
                height: 24px;
            }

            .topbar {
                gap: 0;
                padding: 5px;
            }

            .topbar a {
                padding: 6px 3px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <header class="navigation">
        <a class="logo-pill" href="index.html" aria-label="Bastonul home">
            <img src="logo.png" alt="Bastonul logo">
        </a>
        <nav class="topbar" aria-label="Main navigation">
            <a href="bastobrowser.html">BastoBrowser</a>
            <a href="bastoos.html" aria-current="page">BastoOS</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section class="browser-intro" aria-labelledby="bastoos-title">
            <div class="browser-intro-copy">
                <h1 id="bastoos-title">BastoOS</h1>
                <p>The most Operating systems this day are full of AI and bloatware so we tried to go a different way.</p>
                <button class="download-button" type="button" disabled>Unavailable</button>
            </div>
            <img
                class="browser-intro-image"
                src="bastooslaptop.png"
                alt="BastoOS displayed on a laptop"
            >
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-content">
            <span>Copyright © 2026 Bastonul All rights reserved.</span>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-use.html">Terms of Use</a>
        </div>
    </footer>
</body>
</html>
