<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bastonul</title>
    <link rel="icon" type="image/x-icon" href="logoflavicon.svg">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .hero {
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            align-items: center;
            padding: 100px clamp(28px, 9vw, 144px) 48px;
            background: url("background.png") center / cover no-repeat;
        }

        .navigation {
            position: fixed;
            top: 20px;
            left: 50%;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(-50%);
        }

        .logo-pill,
        .topbar {
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .logo-pill {
            display: grid;
            width: 52px;
            height: 52px;
            flex: 0 0 52px;
            place-items: center;
        }

        .logo-pill img {
            display: block;
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
        }

        .topbar a {
            padding: 10px 16px;
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 160ms ease;
        }

        .topbar a:hover,
        .topbar a:focus-visible {
            background: rgba(255, 255, 255, 0.2);
        }

        .topbar a:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        .browser-download {
            display: grid;
            min-height: 100vh;
            min-height: 100svh;
            padding: 72px 8vw;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.08) 180px,
                transparent 420px
            ), #e7e7e7;
            place-items: center;
        }

        .browser-download-content {
            display: grid;
            width: min(1120px, 100%);
            min-height: calc(100vh - 144px);
            min-height: calc(100svh - 144px);
            margin: 0 auto;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 48px;
        }

        .browser-download-image {
            display: block;
            width: 100%;
            max-height: 336px;
            object-fit: contain;
        }

        .browser-download-copy {
            text-align: center;
        }

        .browser-download-copy h1 {
            margin: 0 0 24px;
            color: #141414;
            font-family: Arial, sans-serif;
            font-size: clamp(30px, 4vw, 48px);
            line-height: 1.15;
        }

        .download-button {
            display: inline-block;
            padding: 13px 28px;
            border-radius: 999px;
            background: #07163f;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 160ms ease;
        }

        .download-button:hover,
        .download-button:focus-visible {
            background: #11318a;
        }

        .download-button:focus-visible {
            outline: 3px solid #555;
            outline-offset: 3px;
        }

        .site-footer {
            padding: 16px 24px;
            background: #e7e7e7;
            color: #999999;
            font-size: 13px;
            text-align: center;
        }

        .site-footer-content {
            display: flex;
            width: fit-content;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            margin: 0 auto;
            padding-top: 12px;
            padding-right: 64px;
            padding-left: 64px;
            border-top: 2px solid currentColor;
            gap: 8px 16px;
        }

        .site-footer a {
            color: inherit;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .navigation {
                top: 12px;
                right: 12px;
                left: 12px;
                width: auto;
                gap: 6px;
                transform: none;
            }

            .logo-pill {
                width: 42px;
                height: 42px;
                flex-basis: 42px;
            }

            .logo-pill img {
                width: 28px;
                height: 28px;
            }

            .topbar {
                min-width: 0;
                flex: 1;
                justify-content: space-between;
                gap: 2px;
                padding: 6px;
            }

            .topbar a {
                padding: 8px clamp(4px, 1.8vw, 7px);
                font-size: clamp(9px, 2.8vw, 11px);
            }

            .browser-download {
                padding: 48px 24px;
            }

            .browser-download-content {
                min-height: calc(100vh - 96px);
                min-height: calc(100svh - 96px);
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .browser-download-image {
                max-height: 240px;
            }
        }

        @media (max-width: 360px) {
            .navigation {
                right: 8px;
                left: 8px;
                gap: 4px;
            }

            .logo-pill {
                width: 36px;
                height: 36px;
                flex-basis: 36px;
            }

            .logo-pill img {
                width: 24px;
                height: 24px;
            }

            .topbar {
                gap: 0;
                padding: 5px;
            }

            .topbar a {
                padding: 6px 3px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="hero" aria-label="Welcome">
            <header class="navigation">
                <div class="logo-pill" aria-label="Basto logo">
                    <img src="logo.png" alt="Basto logo">
                </div>
                <nav class="topbar" aria-label="Main navigation">
                    <a href="bastobrowser.html">BastoBrowser</a>
                    <a href="bastoos.html">BastoOS</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </nav>
            </header>
        </section>
        <section class="browser-download" aria-labelledby="browser-download-title">
            <div class="browser-download-content">
                <div class="browser-download-copy">
                    <h1 id="browser-download-title">BastoBrowser 1.2.0 Beta is here.</h1>
                    <a class="download-button" href="bastobrowser.html">Download</a>
                </div>
                <img
                    class="browser-download-image"
                    src="doncaimage2.png"
                    alt="BastoBrowser"
                >
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer-content">
            <span>Copyright © 2026 Bastonul All rights reserved.</span>
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="terms-of-use.html">Terms of Use</a>
        </div>
    </footer>
</body>         
</html>
